name = "smart-family-finance"
compatibility_date = "2026-09-01"
compatibility_flags = [ "nodejs_compat" ]
main = ".open-next/worker.js"

# CPU time limit - increase from default 50ms to handle cold starts
# Free tier: max 50ms, Paid Bundled: max 30s
# Set to match your Workers plan limits
limits = { cpu_ms = 150 }

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "smart-family-finance-db"
database_id = "d53cb4c2-8150-4fff-852f-7aa3390ffe2c"
migrations_dir = "drizzle/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "smart-family-finance-attachments"
