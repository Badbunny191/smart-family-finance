name = "smart-family-finance"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[triggers]
# รันทุกนาที — handler จะเช็ค sendTime (Asia/Bangkok) เองแบบ HH:mm ตรงกัน
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "smart-family-finance-db"
database_id = "d53cb4c2-8150-4fff-852f-7aa3390ffe2c"
migrations_dir = "drizzle/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "smart-family-finance-attachments"

[env.test]
name = "smart-family-finance-test"

[[env.test.d1_databases]]
binding = "DB"
database_name = "testd1"
database_id = "811d6580-9cfc-46e2-a18b-2f50f37949f9"
migrations_dir = "drizzle/migrations"

[[env.test.r2_buckets]]
binding = "BUCKET"
bucket_name = "smart-family-finance-attachments"